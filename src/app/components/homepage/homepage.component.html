<div class="min-h-screen bg-gray-100">
  <app-navbar></app-navbar>

  <!-- Main Content -->

        </p>
      </div>

      <!-- Quick Actions -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Meeting Card -->
        <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow duration-200 cursor-pointer"

          <div class="flex items-center justify-center w-12 h-12 bg-indigo-100 rounded-lg mb-4">

          <p class="text-gray-600 text-sm">Tạo và quản lý các cuộc họp của bạn</p>
        </div>

        <!-- Calendar Card -->
        <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow duration-200 cursor-pointer"
             routerLink="/calendar">
          <div class="flex items-center justify-center w-12 h-12 bg-green-100 rounded-lg mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />

          <h3 class="text-lg font-semibold text-gray-900 mb-2">Calendar</h3>
          <p class="text-gray-600 text-sm">Xem lịch và các sự kiện sắp tới</p>
        </div>

        <!-- Profile Card -->
        <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow duration-200 cursor-pointer"
             routerLink="/profile">
          <div class="flex items-center justify-center w-12 h-12 bg-purple-100 rounded-lg mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
