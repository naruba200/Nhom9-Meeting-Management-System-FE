<div class="login-container">
  <div class="login-card">
    <h2>Đăng Nhập</h2>
    
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>
    
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="loginData.email" 
          required 
          email
          placeholder="Nhập email của bạn"
        />
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu:</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="loginData.password" 
          required 
          placeholder="Nhập mật khẩu"
        />
      </div>

      <button 
        type="submit" 
        class="btn btn-primary" 
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Đăng Nhập</span>
        <span *ngIf="isLoading">Đang xử lý...</span>
      </button>
    </form>

    <div class="login-links">
      <a routerLink="/forgot-password" class="link">Quên mật khẩu?</a>
      <a routerLink="/register" class="link">Chưa có tài khoản? Đăng ký</a>
    </div>
  </div>
</div>

@if (showErrorModal) {
  <div class="error-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="login-error-title">
    <div class="error-modal">
      <div class="error-modal-icon" aria-hidden="true">⚠️</div>
      <h3 id="login-error-title">Lỗi kết nối</h3>
      <p>{{ apiErrorMessage }}</p>
      <button class="btn btn-primary" (click)="closeErrorModal()" autofocus>Đóng</button>
    </div>
  </div>
}
