<div class="reset-password-container">
  <div class="reset-password-card">
    <h1>Đặt Lại Mật Khẩu</h1>
    
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>
    
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit(form)" #form="ngForm" class="reset-password-form">
      <!-- Token Input -->
      <div class="form-group">
        <label for="token">Token Đặt Lại Mật Khẩu <span class="required">*</span></label>
        <p class="help-text">Sao chép token từ email bạn nhận được</p>
        <textarea
          id="token"
          class="form-control"
          [(ngModel)]="resetPasswordData.token"
          name="token"
          placeholder="Dán token đầy đủ từ email vào đây..."
          rows="3"
          required
          [disabled]="loading"
          ngDefaultControl
        ></textarea>
      </div>

      <!-- New Password Input -->
      <div class="form-group">
        <label for="newPassword">Mật Khẩu Mới <span class="required">*</span></label>
        <div class="input-group">
          <input
            id="newPassword"
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="resetPasswordData.newPassword"
            name="newPassword"
            placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)"
            required
            [disabled]="loading"
          />
          <button 
            type="button" 
            class="toggle-btn"
            (click)="toggleShowPassword()"
            [disabled]="loading"
            title="Hiển thị/Ẩn mật khẩu"
          >
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <!-- Confirm Password Input -->
      <div class="form-group">
        <label for="confirmPassword">Xác Nhận Mật Khẩu <span class="required">*</span></label>
        <div class="input-group">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Nhập lại mật khẩu mới"
            required
            [disabled]="loading"
          />
          <button 
            type="button" 
            class="toggle-btn"
            (click)="toggleShowConfirmPassword()"
            [disabled]="loading"
            title="Hiển thị/Ẩn mật khẩu"
          >
            {{ showConfirmPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading || form.invalid"
      >
        {{ loading ? 'Đang Xử Lý...' : 'Đặt Lại Mật Khẩu' }}
      </button>
    </form>

    <div class="footer-links">
      <a routerLink="/login">Quay lại đăng nhập</a>
    </div>
  </div>
</div>
