<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <div class="user-info">
      <span>Xin chào, {{ userInfo?.fullName || 'User' }}!</span>
      <app-user-menu [fullName]="userInfo?.fullName || ''" [email]="userInfo?.email || ''"></app-user-menu>
    </div>
  </div>
  
  <div class="dashboard-content">
    <div class="welcome-card">
      <h2>Chào mừng đến với hệ thống!</h2>
      <p>Bạn đã đăng nhập thành công với email: {{ userInfo?.email }}</p>
      <p>Đây là trang dashboard được bảo vệ bởi Auth Guard.</p>
    </div>
  </div>
</div>
