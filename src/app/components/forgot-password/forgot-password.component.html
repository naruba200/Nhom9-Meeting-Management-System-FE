<div class="forgot-password-container">
  <div class="forgot-password-card">
    <h2>Quên Mật Khẩu</h2>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
      <div class="success-actions">
        <button 
          type="button" 
          class="btn btn-primary btn-small link-btn"
          routerLink="/reset-password"
        >
          Tiếp Tục
        </button>
      </div>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit(forgotForm)" #forgotForm="ngForm" novalidate *ngIf="!successMessage">
      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="forgotPasswordData.email"
          [disabled]="isLoading"
          required
          email
          placeholder="Nhập email đã đăng ký"
          #emailModel="ngModel"
          [class.input-error]="emailModel.invalid && (emailModel.touched || forgotForm.submitted)"
        />
        <div class="field-error" *ngIf="emailModel.invalid && (emailModel.touched || forgotForm.submitted)">
          <span *ngIf="emailModel.errors?.['required']">Vui lòng nhập email.</span>
          <span *ngIf="emailModel.errors?.['email']">Email không đúng định dạng.</span>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Gửi Yêu Cầu</span>
        <span *ngIf="isLoading">Đang xử lý...</span>
      </button>
    </form>

    <div class="forgot-password-links" *ngIf="!successMessage">
      <a routerLink="/login" class="link">Quay lại đăng nhập</a>
      <a routerLink="/register" class="link">Chưa có tài khoản? Đăng ký</a>
    </div>
  </div>
</div>
