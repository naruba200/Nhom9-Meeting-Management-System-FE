<div class="register-container">
  <div class="register-card">
    <h2>Đăng Ký</h2>
    
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
      <div *ngIf="showOtpVerification" class="otp-info">
        <p>Vui lòng kiểm tra email và xác minh OTP để hoàn tất đăng ký.</p>
        <p>Đang chuyển sang trang xác minh OTP...</p>
      </div>
    </div>
    
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!showOtpVerification">
      <div class="form-group">
        <label for="fullName">Họ và tên:</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          [(ngModel)]="registerData.fullName" 
          required 
          placeholder="Nhập họ và tên của bạn"
        />
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="registerData.email" 
          required 
          email
          placeholder="Nhập email của bạn"
        />
      </div>

      <div class="form-group">
        <label for="phone">Số điện thoại:</label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          [(ngModel)]="registerData.phone" 
          required 
          placeholder="Nhập số điện thoại của bạn"
        />
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu:</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="registerData.password" 
          required 
          minlength="6"
          placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Xác nhận mật khẩu:</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          required 
          placeholder="Nhập lại mật khẩu"
        />
      </div>

      <button 
        type="submit" 
        class="btn btn-primary" 
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Đăng Ký</span>
        <span *ngIf="isLoading">Đang xử lý...</span>
      </button>
    </form>

    <div class="register-links" *ngIf="!showOtpVerification">
      <a routerLink="/login" class="link">Đã có tài khoản? Đăng nhập</a>
    </div>
  </div>
</div>
