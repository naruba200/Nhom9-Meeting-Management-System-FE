<div class="bg-white rounded-xl shadow-sm p-6 sticky top-6">
  <h2 class="text-xl font-bold text-gray-800 mb-6 font-['Inter'] flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
    </svg>
    Tạo cuộc họp mới
  </h2>

  <!-- Success Message -->
  <div *ngIf="successMessage" 
       class="mb-4 p-3 bg-green-100 border border-green-300 text-green-700 rounded-lg flex items-center gap-2 animate-fade-in">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
    {{ successMessage }}
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" 
       class="mb-4 p-3 bg-red-100 border border-red-300 text-red-700 rounded-lg flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    {{ errorMessage }}
  </div>

  <form [formGroup]="meetingForm" (ngSubmit)="onSubmit()" class="space-y-5">
    <!-- Title Field -->
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
        Tiêu đề cuộc họp <span class="text-red-500">*</span>
      </label>
      <input type="text"
             id="title"
             formControlName="title"
             placeholder="Nhập tiêu đề cuộc họp"
             class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 outline-none"
             [class.border-red-500]="titleControl?.invalid && titleControl?.touched">
      <p *ngIf="titleControl?.invalid && titleControl?.touched" class="mt-1 text-sm text-red-500">
        <span *ngIf="titleControl?.errors?.['required']">Tiêu đề là bắt buộc</span>
        <span *ngIf="titleControl?.errors?.['minlength']">Tiêu đề phải có ít nhất 3 ký tự</span>
      </p>
    </div>

    <!-- Date Field -->
    <div>
      <label for="date" class="block text-sm font-medium text-gray-700 mb-1">
        Ngày <span class="text-red-500">*</span>
      </label>
      <input type="date"
             id="date"
             formControlName="date"
             [min]="getMinDate()"
             class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 outline-none"
             [class.border-red-500]="dateControl?.invalid && dateControl?.touched">
      <p *ngIf="dateControl?.invalid && dateControl?.touched" class="mt-1 text-sm text-red-500">
        Vui lòng chọn ngày
      </p>
    </div>

    <!-- Time Fields -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="startTime" class="block text-sm font-medium text-gray-700 mb-1">
          Bắt đầu <span class="text-red-500">*</span>
        </label>
        <input type="time"
               id="startTime"
               formControlName="startTime"
               class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 outline-none"
               [class.border-red-500]="startTimeControl?.invalid && startTimeControl?.touched">
      </div>
      <div>
        <label for="endTime" class="block text-sm font-medium text-gray-700 mb-1">
          Kết thúc <span class="text-red-500">*</span>
        </label>
        <input type="time"
               id="endTime"
               formControlName="endTime"
               class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 outline-none"
               [class.border-red-500]="endTimeControl?.invalid && endTimeControl?.touched">
      </div>
    </div>

    <!-- Participants Field -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Người tham gia <span class="text-red-500">*</span>
      </label>
      <div class="flex gap-2">
        <input type="email"
               [(ngModel)]="participantEmail"
               [ngModelOptions]="{standalone: true}"
               (keypress)="onKeyPress($event, participantEmail)"
               placeholder="Nhập email người tham gia"
               class="flex-1 px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 outline-none">
        <button type="button"
                (click)="addParticipant(participantEmail)"
                class="px-4 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:bg-indigo-800 transition-all duration-200 hover:shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </button>
      </div>

      <!-- Participants List -->
      <div *ngIf="participantEmails.length > 0" class="mt-3 space-y-2">
        <div *ngFor="let email of participantEmails.controls; let i = index"
             class="flex items-center justify-between bg-gray-50 px-3 py-2 rounded-lg">
          <span class="text-sm text-gray-700">{{ email.value }}</span>
          <button type="button"
                  (click)="removeParticipant(i)"
                  class="text-red-500 hover:text-red-700 hover:bg-red-100 p-1 rounded-full transition-all duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <p *ngIf="participantEmails.length === 0" class="mt-2 text-sm text-gray-500">
        Chưa có người tham gia nào được thêm
      </p>
    </div>

    <!-- Submit Button -->
    <button type="submit"
            [disabled]="isSubmitting"
            class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 active:bg-indigo-800 transition-all duration-200 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
      <svg *ngIf="isSubmitting" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <svg *ngIf="!isSubmitting" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
      {{ isSubmitting ? 'Đang tạo...' : 'Xác nhận tạo' }}
    </button>
  </form>
</div>
